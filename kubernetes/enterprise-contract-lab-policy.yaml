apiVersion: appstudio.redhat.com/v1alpha1
kind: EnterpriseContractPolicy
metadata:
  name: lab-policy
  namespace: enterprise-contract-service
spec:
  description: Lab policy with custom trusted tasks from quay.io/rhpds/pipeline-docker-build-lab
  name: Lab
  publicKey: k8s://openshift-pipelines/public-key
  sources:
  - name: Lab
    policy:
    - oci::quay.io/conforma/release-policy:latest@sha256:10de4ff888f9d054baeaa15c528ff74118bfd3c99ed0e5fc0ac24e72e83e01dc
    data:
    - github.com/release-engineering/rhtap-ec-policy//data
    - oci::quay.io/konflux-ci/tekton-catalog/data-acceptable-bundles:latest
    - github.com/rhpds/konflux-tssc-lab.git//tekton/data
    config:
      exclude:
      - hermetic_task
      - source_image
      - rpm_repos
      # Exclude pinned refs requirement (lab uses bundle with tag)
      - tasks.pinned_task_refs
      # Exclude CPE label requirement (not a product release)
      - labels.required_labels:cpe
      # Exclude missing required tasks (lab pipeline has alternatives)
      - tasks.required_tasks_found:buildah
      - tasks.required_tasks_found:buildah-oci-ta
      - tasks.required_tasks_found:clair-scan
      - tasks.required_tasks_found:roxctl-scan
      - tasks.required_tasks_found:git-clone
      - tasks.required_tasks_found:git-clone-oci-ta
      - tasks.required_tasks_found:prefetch-dependencies
      - tasks.required_tasks_found:prefetch-dependencies-oci-ta
      - tasks.required_tasks_found:sast-shell-check
      - tasks.required_tasks_found:sast-shell-check-oci-ta
      - tasks.required_tasks_found:sast-snyk-check
      - tasks.required_tasks_found:sast-snyk-check-oci-ta
      - tasks.required_tasks_found:sast-unicode-check
      - tasks.required_tasks_found:sast-unicode-check-oci-ta
      - tasks.required_tasks_found:source-build
      - tasks.required_tasks_found:source-build-oci-ta
      - tasks.required_tasks_found:clamav-scan
      include:
      - '@redhat'
