---
# Lab user identifier (e.g. user-abc12)
ocp4_workload_konflux_tssc_tenant_user: "user-{{ guid }}"

# Namespace where the user's Konflux tenant resources live
ocp4_workload_konflux_tssc_tenant_namespace: "{{ ocp4_workload_konflux_tssc_tenant_user }}"

# Lab user password (must be provided for Quay access)
ocp4_workload_konflux_tssc_tenant_password: ""

# Quay registry host (must be provided)
ocp4_workload_konflux_tssc_quay_host: ""

# Workload control
ocp4_workload_konflux_tssc_tenant_become_override: false
ocp4_workload_konflux_tssc_tenant_silent: false
