---
# Configure the managed namespace to be visible in Konflux UI
# The managed namespace is the production/release target

- name: Add konflux-ci.dev/type=tenant label to managed namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ ocp4_workload_konflux_tssc_tenant_user }}-managed"
    merge_type: merge
    definition:
      metadata:
        labels:
          konflux-ci.dev/type: tenant

- name: Bind lab user to konflux-admin-user-actions in managed namespace
  kubernetes.core.k8s:
    state: present
    template: rolebinding-konflux-admin-managed.yaml.j2

- name: Get Quay registry host from route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: quay-quay
    namespace: quay-enterprise
  register: r_quay_route

- name: Set Quay registry host fact
  ansible.builtin.set_fact:
    quay_registry_host: "{{ r_quay_route.resources[0].spec.host }}"

- name: Create Quay push secret in managed namespace for release pipeline
  kubernetes.core.k8s:
    state: present
    template: secret-quay-push.yaml.j2

- name: Get pipeline service account
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ServiceAccount
    name: pipeline
    namespace: "{{ ocp4_workload_konflux_tssc_tenant_user }}-managed"
  register: r_pipeline_sa

- name: Link Quay push secret to pipeline service account
  kubernetes.core.k8s:
    api_version: v1
    kind: ServiceAccount
    name: pipeline
    namespace: "{{ ocp4_workload_konflux_tssc_tenant_user }}-managed"
    definition:
      secrets: "{{ (r_pipeline_sa.resources[0].secrets | default([])) + [{'name': 'quay-push-secret'}] }}"
  when: r_pipeline_sa.resources | length > 0 and ('quay-push-secret' not in (r_pipeline_sa.resources[0].secrets | default([]) | map(attribute='name') | list))

- name: Create simple Enterprise Contract policy for releases
  kubernetes.core.k8s:
    state: present
    template: enterprisecontractpolicy-release.yaml.j2
