---
# Configure the managed namespace to be visible in Konflux UI
# The managed namespace is the production/release target

- name: Add konflux-ci.dev/type=tenant label to managed namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ ocp4_workload_konflux_tssc_tenant_user }}-managed"
    merge_type: merge
    definition:
      metadata:
        labels:
          konflux-ci.dev/type: tenant

- name: Bind lab user to konflux-admin-user-actions in managed namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: konflux-admin
        namespace: "{{ ocp4_workload_konflux_tssc_tenant_user }}-managed"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: konflux-admin-user-actions
      subjects:
        - apiGroup: rbac.authorization.k8s.io
          kind: User
          name: "{{ ocp4_workload_konflux_tssc_tenant_user }}"

- name: Get Quay registry host from route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: quay-quay
    namespace: quay-enterprise
  register: r_quay_route

- name: Set Quay registry host fact
  ansible.builtin.set_fact:
    quay_registry_host: "{{ r_quay_route.resources[0].spec.host }}"

- name: Create Quay push secret in managed namespace for release pipeline
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: quay-push-secret
        namespace: "{{ ocp4_workload_konflux_tssc_tenant_user }}-managed"
      type: kubernetes.io/dockerconfigjson
      stringData:
        .dockerconfigjson: |
          {
            "auths": {
              "{{ quay_registry_host }}": {
                "auth": "{{ (ocp4_workload_konflux_tssc_tenant_user + ':' + ocp4_workload_konflux_tssc_tenant_password) | b64encode }}"
              }
            }
          }

- name: Link Quay push secret to pipeline service account
  ansible.builtin.shell: |
    oc patch serviceaccount pipeline \
      -n {{ ocp4_workload_konflux_tssc_tenant_user }}-managed \
      --type=json \
      -p='[{"op": "add", "path": "/secrets/-", "value": {"name": "quay-push-secret"}}]'
  register: r_sa_patch
  failed_when:
    - r_sa_patch.rc != 0
    - '"already exists" not in r_sa_patch.stderr'

- name: Create simple Enterprise Contract policy for releases
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: appstudio.redhat.com/v1alpha1
      kind: EnterpriseContractPolicy
      metadata:
        name: default-policy
        namespace: "{{ ocp4_workload_konflux_tssc_tenant_user }}-managed"
      spec:
        description: Simple release policy for lab environment
        name: Lab Release Policy
        publicKey: k8s://openshift-pipelines/public-key
        sources:
        - name: Release Policy
          policy:
          - oci::quay.io/konflux-ci/tekton-catalog/policy-release:latest
          config:
            include:
            - attestation_type
            - attestation_task_bundle
            - slsa_provenance_available
            - slsa_build_build_service
