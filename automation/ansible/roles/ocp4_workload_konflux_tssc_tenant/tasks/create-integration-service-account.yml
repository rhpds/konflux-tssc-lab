---
- name: Create konflux-integration-runner service account
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: konflux-integration-runner
        namespace: "{{ ocp4_workload_konflux_tssc_tenant_namespace }}"

- name: Create Job to link Quay pull secret and set image visibility
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: setup-konflux-integration
        namespace: "{{ ocp4_workload_konflux_tssc_tenant_namespace }}"
      spec:
        backoffLimit: 100
        template:
          spec:
            serviceAccountName: pipeline
            restartPolicy: OnFailure
            containers:
            - name: setup
              image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
              command:
              - /bin/bash
              - -c
              - |
                set -e
                echo "Waiting for components-namespace-pull secret and ImageRepository..."
                while ! oc get secret components-namespace-pull -n {{ ocp4_workload_konflux_tssc_tenant_namespace }} &>/dev/null; do
                  sleep 30
                done
                echo "Secret found, linking to service account..."
                oc patch serviceaccount konflux-integration-runner -n {{ ocp4_workload_konflux_tssc_tenant_namespace }} \
                  --type=json -p='[{"op":"add","path":"/imagePullSecrets/-","value":{"name":"components-namespace-pull"}}]' || true

                echo "Setting ImageRepository visibility to public..."
                for repo in $(oc get imagerepository -n {{ ocp4_workload_konflux_tssc_tenant_namespace }} -o name); do
                  oc patch $repo -n {{ ocp4_workload_konflux_tssc_tenant_namespace }} \
                    --type=merge -p '{"spec":{"image":{"visibility":"public"}}}'
                  echo "Set $repo to public"
                done
                echo "Setup complete"
