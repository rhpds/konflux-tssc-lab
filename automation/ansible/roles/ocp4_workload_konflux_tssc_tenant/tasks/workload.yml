---
- name: Configure managed namespace for Konflux UI visibility
  ansible.builtin.include_tasks: setup-managed-namespace.yml

- name: Bind lab user to konflux-admin-user-actions in tenant namespace
  kubernetes.core.k8s:
    state: present
    template: rolebinding-admin.yaml.j2

- name: Create Tekton viewer role in tenant namespace
  kubernetes.core.k8s:
    state: present
    template: role-tekton-viewer.yaml.j2

- name: Bind lab user to tekton-viewer role
  kubernetes.core.k8s:
    state: present
    template: rolebinding-tekton-viewer.yaml.j2

- name: Create integration service account for Enterprise Contract
  ansible.builtin.include_tasks: create-integration-service-account.yml

- name: Grant user access to Quay tsf organization
  ansible.builtin.include_tasks: grant-quay-access.yml

- name: Grant managed pipeline SA read access to tenant namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: managed-pipeline-reader
        namespace: "{{ ocp4_workload_konflux_tssc_tenant_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: konflux-viewer-user-actions
      subjects:
        - kind: ServiceAccount
          name: pipeline
          namespace: "{{ ocp4_workload_konflux_tssc_tenant_user }}-managed"
