---
- name: Get cluster ingress domain
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Ingress
    name: cluster
  register: r_cluster_ingress

- name: Set apps domain fact
  ansible.builtin.set_fact:
    ocp_apps_domain: "{{ r_cluster_ingress.resources[0].spec.domain }}"

- name: Create predictable Quay route alias for Showroom tab
  kubernetes.core.k8s:
    state: present
    template: route-quay-showroom.yaml.j2
