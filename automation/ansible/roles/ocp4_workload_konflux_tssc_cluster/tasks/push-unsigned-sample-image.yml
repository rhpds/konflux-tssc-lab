---
# Push an unsigned sample image to Quay for policy violation testing
# This image is intentionally unsigned to demonstrate EC policy failures

- name: Create tsf organization in Quay if it doesn't exist
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: quay.redhat.com/v1
      kind: QuayOrganization
      metadata:
        name: tsf
        namespace: quay-enterprise
      spec:
        name: tsf

- name: Wait for tsf organization to be ready
  kubernetes.core.k8s_info:
    api_version: quay.redhat.com/v1
    kind: QuayOrganization
    name: tsf
    namespace: quay-enterprise
  register: r_org
  retries: 10
  delay: 5
  until:
  - r_org.resources is defined
  - r_org.resources | length > 0

- name: Set Quay registry URL from predictable route
  ansible.builtin.set_fact:
    quay_registry: "quay.{{ openshift_api_url | regex_replace('^https?://', '') | regex_replace(':[0-9]+$', '') | regex_replace('^api\\.', 'apps.') }}"

- name: Get Quay admin credentials
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: quay-super-user
    namespace: quay-system
  register: r_quay_admin_secret

- name: Set Quay admin password
  ansible.builtin.set_fact:
    quay_admin_password: "{{ r_quay_admin_secret.resources[0].data.password | b64decode }}"

- name: Create temporary directory for image work
  ansible.builtin.tempfile:
    state: directory
    prefix: unsigned-image-
  register: r_temp_dir

- name: Create podman auth file
  ansible.builtin.copy:
    content: |
      {
        "auths": {
          "{{ quay_registry }}": {
            "auth": "{{ ('quay:' + quay_admin_password) | b64encode }}"
          }
        }
      }
    dest: "{{ r_temp_dir.path }}/auth.json"
    mode: '0600'

- name: Push unsigned image to Quay tsf org
  ansible.builtin.command:
    cmd: >
      skopeo copy
      --dest-tls-verify=false
      --dest-authfile {{ r_temp_dir.path }}/auth.json
      docker://registry.access.redhat.com/ubi9/ubi-minimal:latest
      docker://{{ quay_registry }}/tsf/unsigned-image:latest
  register: r_skopeo_copy
  retries: 3
  delay: 10
  until: r_skopeo_copy.rc == 0

- name: Make unsigned-image repository public
  ansible.builtin.uri:
    url: "https://{{ quay_registry }}/api/v1/repository/tsf/unsigned-image/changevisibility"
    method: POST
    body_format: json
    body:
      visibility: public
    headers:
      Authorization: "Bearer {{ quay_admin_password }}"
      Content-Type: "application/json"
    validate_certs: false
    status_code: [200, 201]
  ignore_errors: true

- name: Clean up temporary directory
  ansible.builtin.file:
    path: "{{ r_temp_dir.path }}"
    state: absent

- name: Print unsigned image location
  ansible.builtin.debug:
    msg: "Unsigned image available at: {{ quay_registry }}/tsf/unsigned-image:latest"
