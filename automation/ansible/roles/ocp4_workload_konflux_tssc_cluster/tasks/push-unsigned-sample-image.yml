---
# Push an unsigned sample image to Quay for policy violation testing
# This image is intentionally unsigned to demonstrate EC policy failures

- name: Get Quay registry URL from route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: quay-showroom
    namespace: quay-enterprise
  register: r_quay_route

- name: Set Quay registry URL
  ansible.builtin.set_fact:
    quay_registry: "{{ r_quay_route.resources[0].spec.host }}"

- name: Wait for the Quay alias registry API from the push pod
  kubernetes.core.k8s_exec:
    namespace: tsf
    pod: tsf-cli
    command: >-
      bash -c {{ lookup('ansible.builtin.file', 'quay-registry-probe.sh') | quote }}
      -- {{ ('https://' ~ quay_registry ~ '/v2/') | quote }}
  register: r_quay_readiness_probe
  changed_when: false
  failed_when: (r_quay_readiness_probe.rc | default(r_quay_readiness_probe.return_code | default(1)) | int) != 0

- name: Get Quay admin credentials
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: quay-admin-credentials
    namespace: quay-enterprise
  register: r_quay_admin_secret
  no_log: true

- name: Get Quay admin token for API access
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: quay-admin-token
    namespace: quay-enterprise
  register: r_quay_admin_token_secret
  no_log: true

- name: Set Quay admin username, password, and token
  ansible.builtin.set_fact:
    quay_admin_username: "{{ r_quay_admin_secret.resources[0].data.username | b64decode }}"
    quay_admin_password: "{{ r_quay_admin_secret.resources[0].data.password | b64decode }}"
    quay_admin_token: "{{ r_quay_admin_token_secret.resources[0].data.token | b64decode }}"
  no_log: true

- name: Download and use static skopeo in tsf-cli pod to push unsigned image
  kubernetes.core.k8s_exec:
    namespace: tsf
    pod: tsf-cli
    command: |
      bash -c '
      set -e

      echo "=== Downloading static skopeo binary ==="
      curl -sL https://github.com/lework/skopeo-binary/releases/download/v1.16.1/skopeo-linux-amd64 -o /tmp/skopeo
      chmod +x /tmp/skopeo

      echo "=== Creating skopeo policy.json ==="
      mkdir -p /tmp/containers
      cat > /tmp/containers/policy.json <<EOF
      {
        "default": [
          {
            "type": "insecureAcceptAnything"
          }
        ]
      }
      EOF

      echo "=== Creating auth file ==="
      mkdir -p /tmp/auth
      cat > /tmp/auth/config.json <<EOF
      {
        "auths": {
          "{{ quay_registry }}": {
            "auth": "$(echo -n "{{ quay_admin_username }}:{{ quay_admin_password }}" | base64)"
          }
        }
      }
      EOF

      echo "=== Copying UBI minimal to Quay tsf org ==="
      /tmp/skopeo copy \
        --policy /tmp/containers/policy.json \
        --dest-tls-verify=false \
        --dest-authfile /tmp/auth/config.json \
        docker://registry.access.redhat.com/ubi9/ubi-minimal:latest \
        docker://{{ quay_registry }}/tsf/unsigned-image:latest

      echo "=== Making repository public ==="
      curl -X POST \
        -k \
        -H "Authorization: Bearer {{ quay_admin_token }}" \
        -H "Content-Type: application/json" \
        -d "{\"visibility\": \"public\"}" \
        "https://{{ quay_registry }}/api/v1/repository/tsf/unsigned-image/changevisibility"

      echo ""
      echo "=== Complete ==="
      echo "Unsigned image available at: {{ quay_registry }}/tsf/unsigned-image:latest"

      rm -rf /tmp/skopeo /tmp/auth /tmp/containers
      '
  register: r_push_image
  # The rendered command contains credentials; publish only allowlisted diagnostics.
  no_log: true
  failed_when: false

- name: Record whether the unsigned image push failed
  ansible.builtin.set_fact:
    quay_unsigned_push_failed: "{{ (r_push_image.rc | default(r_push_image.return_code | default(1)) | int) != 0 }}"

- name: Probe the Quay alias once after a failed push
  kubernetes.core.k8s_exec:
    namespace: tsf
    pod: tsf-cli
    command: >-
      bash -c {{ lookup('ansible.builtin.file', 'quay-registry-probe.sh') | quote }}
      -- {{ ('https://' ~ quay_registry ~ '/v2/') | quote }} 1
  register: r_quay_failure_probe
  changed_when: false
  failed_when: false
  when: quay_unsigned_push_failed | bool

- name: Report sanitized unsigned image push failure
  ansible.builtin.fail:
    msg: >-
      Unsigned image push failed; no push retry was attempted.
      Exit code: {{ r_push_image.rc | default(r_push_image.return_code | default('unavailable')) }}.
      Registry HTTP status from skopeo: {{ (r_push_image.stderr | default('') |
        regex_findall('StatusCode: ([0-9]{3})') | first) | default('unavailable') }}.
      Post-failure alias probe: {{ r_quay_failure_probe.stdout | default('unavailable') }}.
      Probe success does not establish that registry writes work.
  when: quay_unsigned_push_failed | bool

- name: Report successful unsigned image push
  ansible.builtin.debug:
    msg: "Unsigned sample image push completed successfully."
