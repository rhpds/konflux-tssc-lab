---
# Push an unsigned sample image to Quay for policy violation testing
# This image is intentionally unsigned to demonstrate EC policy failures

- name: Get Quay registry URL from route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: quay-showroom
    namespace: quay-enterprise
  register: r_quay_route

- name: Set Quay registry URL
  ansible.builtin.set_fact:
    quay_registry: "{{ r_quay_route.resources[0].spec.host }}"

- name: Get Quay admin credentials
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: quay-admin-credentials
    namespace: quay-enterprise
  register: r_quay_admin_secret

- name: Get Quay admin token for API access
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: quay-admin-token
    namespace: quay-enterprise
  register: r_quay_admin_token_secret

- name: Set Quay admin username, password, and token
  ansible.builtin.set_fact:
    quay_admin_username: "{{ r_quay_admin_secret.resources[0].data.username | b64decode }}"
    quay_admin_password: "{{ r_quay_admin_secret.resources[0].data.password | b64decode }}"
    quay_admin_token: "{{ r_quay_admin_token_secret.resources[0].data.token | b64decode }}"

- name: Create unsigned-image repository in tsf organization
  ansible.builtin.uri:
    url: "https://{{ quay_registry }}/api/v1/repository"
    method: POST
    headers:
      Authorization: "Bearer {{ quay_admin_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      namespace: tsf
      repository: unsigned-image
      description: "Unsigned sample image for policy violation testing"
      visibility: public
    validate_certs: false
    status_code:
      - 201  # Created
      - 400  # May already exist
  register: r_create_repo
  ignore_errors: true

- name: Download and use static skopeo in tsf-cli pod to push unsigned image
  kubernetes.core.k8s_exec:
    namespace: tsf
    pod: tsf-cli
    command: |
      bash -c '
      set -e

      echo "=== Downloading static skopeo binary ==="
      curl -sL https://github.com/lework/skopeo-binary/releases/download/v1.16.1/skopeo-linux-amd64 -o /tmp/skopeo
      chmod +x /tmp/skopeo

      echo "=== Creating skopeo policy.json ==="
      mkdir -p /tmp/containers
      cat > /tmp/containers/policy.json <<EOF
      {
        "default": [
          {
            "type": "insecureAcceptAnything"
          }
        ]
      }
      EOF

      echo "=== Copying UBI minimal to Quay tsf org with admin credentials ==="
      /tmp/skopeo copy \
        --policy /tmp/containers/policy.json \
        --dest-tls-verify=false \
        --dest-creds="{{ quay_admin_username }}:{{ quay_admin_password }}" \
        docker://registry.access.redhat.com/ubi9/ubi-minimal:latest \
        docker://{{ quay_registry }}/tsf/unsigned-image:latest

      echo "=== Making repository public ==="
      curl -X POST \
        -k \
        -H "Authorization: Bearer {{ quay_admin_token }}" \
        -H "Content-Type: application/json" \
        -d "{\"visibility\": \"public\"}" \
        "https://{{ quay_registry }}/api/v1/repository/tsf/unsigned-image/changevisibility"

      echo ""
      echo "=== Complete ==="
      echo "Unsigned image available at: {{ quay_registry }}/tsf/unsigned-image:latest"

      rm -rf /tmp/skopeo /tmp/containers
      '
  register: r_push_image
  retries: 3
  delay: 10
  until: r_push_image.rc == 0

- name: Print push output
  ansible.builtin.debug:
    msg: "{{ r_push_image.stdout_lines }}"
