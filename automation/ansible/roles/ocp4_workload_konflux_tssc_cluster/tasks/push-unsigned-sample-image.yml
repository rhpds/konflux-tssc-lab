---
# Push an unsigned sample image to Quay for policy violation testing
# This image is intentionally unsigned to demonstrate EC policy failures

- name: Create tsf organization in Quay if it doesn't exist
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: quay.redhat.com/v1
      kind: QuayOrganization
      metadata:
        name: tsf
        namespace: quay-enterprise
      spec:
        name: tsf

- name: Wait for tsf organization to be ready
  kubernetes.core.k8s_info:
    api_version: quay.redhat.com/v1
    kind: QuayOrganization
    name: tsf
    namespace: quay-enterprise
  register: r_org
  retries: 10
  delay: 5
  until:
  - r_org.resources is defined
  - r_org.resources | length > 0

- name: Set Quay registry URL from predictable route
  ansible.builtin.set_fact:
    quay_registry: "quay.{{ openshift_api_url | regex_replace('^https?://', '') | regex_replace(':[0-9]+$', '') | regex_replace('^api\\.', 'apps.') }}"

- name: Create Job to push unsigned image
  kubernetes.core.k8s:
    state: present
    template: job-push-unsigned-image.yaml.j2

- name: Wait for push-unsigned-image Job to complete
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    name: push-unsigned-image
    namespace: quay-enterprise
  register: r_job
  retries: 30
  delay: 10
  until:
  - r_job.resources is defined
  - r_job.resources | length > 0
  - r_job.resources[0].status.conditions is defined
  - r_job.resources[0].status.conditions | selectattr('type', 'equalto', 'Complete') | list | length > 0

- name: Get Job logs
  kubernetes.core.k8s_log:
    api_version: batch/v1
    kind: Job
    name: push-unsigned-image
    namespace: quay-enterprise
  register: r_job_logs

- name: Print Job output
  ansible.builtin.debug:
    msg: "{{ r_job_logs.log_lines }}"

- name: Print unsigned image location
  ansible.builtin.debug:
    msg: "Unsigned image available at: {{ quay_registry }}/tsf/unsigned-image:latest"
