---
# Push an unsigned sample image to Quay for policy violation testing
# This image is intentionally unsigned to demonstrate EC policy failures

- name: Create tsf organization in Quay if it doesn't exist
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: quay.redhat.com/v1
      kind: QuayOrganization
      metadata:
        name: tsf
        namespace: quay-enterprise
      spec:
        name: tsf

- name: Wait for tsf organization to be ready
  kubernetes.core.k8s_info:
    api_version: quay.redhat.com/v1
    kind: QuayOrganization
    name: tsf
    namespace: quay-enterprise
  register: r_org
  retries: 10
  delay: 5
  until:
  - r_org.resources is defined
  - r_org.resources | length > 0

- name: Set Quay registry URL from predictable route
  ansible.builtin.set_fact:
    quay_registry: "quay.{{ openshift_api_url | regex_replace('^https?://', '') | regex_replace(':[0-9]+$', '') | regex_replace('^api\\.', 'apps.') }}"

- name: Get Quay admin credentials
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: quay-admin-credentials
    namespace: quay-enterprise
  register: r_quay_admin_secret

- name: Set Quay admin username and password
  ansible.builtin.set_fact:
    quay_admin_username: "{{ r_quay_admin_secret.resources[0].data.username | b64decode }}"
    quay_admin_password: "{{ r_quay_admin_secret.resources[0].data.password | b64decode }}"

- name: Download and use static skopeo in tsf-cli pod to push unsigned image
  kubernetes.core.k8s_exec:
    namespace: tsf
    pod: tsf-cli
    command: |
      bash -c '
      set -e

      echo "=== Downloading static skopeo binary ==="
      curl -sL https://github.com/lework/skopeo-binary/releases/download/v1.16.1/skopeo-linux-amd64 -o /tmp/skopeo
      chmod +x /tmp/skopeo

      echo "=== Creating skopeo policy.json ==="
      mkdir -p /tmp/containers
      cat > /tmp/containers/policy.json <<EOF
      {
        "default": [
          {
            "type": "insecureAcceptAnything"
          }
        ]
      }
      EOF

      echo "=== Creating auth file ==="
      mkdir -p /tmp/auth
      cat > /tmp/auth/config.json <<EOF
      {
        "auths": {
          "{{ quay_registry }}": {
            "auth": "$(echo -n "{{ quay_admin_username }}:{{ quay_admin_password }}" | base64)"
          }
        }
      }
      EOF

      echo "=== Copying UBI minimal to Quay tsf org ==="
      /tmp/skopeo copy \
        --policy /tmp/containers/policy.json \
        --dest-tls-verify=false \
        --dest-authfile /tmp/auth/config.json \
        docker://registry.access.redhat.com/ubi9/ubi-minimal:latest \
        docker://{{ quay_registry }}/tsf/unsigned-image:latest

      echo "=== Making repository public (may fail due to CSRF - image is still usable) ==="
      curl -X POST \
        -k \
        -H "Authorization: Bearer {{ quay_admin_password }}" \
        -H "Content-Type: application/json" \
        -d "{\"visibility\": \"public\"}" \
        "https://{{ quay_registry }}/api/v1/repository/tsf/unsigned-image/changevisibility" || echo "Note: API call failed but image was pushed successfully"

      echo ""
      echo "=== Complete ==="
      echo "Unsigned image available at: {{ quay_registry }}/tsf/unsigned-image:latest"

      rm -rf /tmp/skopeo /tmp/auth /tmp/containers
      '
  register: r_push_image

- name: Print push output
  ansible.builtin.debug:
    msg: "{{ r_push_image.stdout_lines }}"
