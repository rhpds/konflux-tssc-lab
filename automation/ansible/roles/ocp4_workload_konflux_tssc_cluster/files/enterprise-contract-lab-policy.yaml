apiVersion: appstudio.redhat.com/v1alpha1
kind: EnterpriseContractPolicy
metadata:
  name: lab-policy
  namespace: enterprise-contract-service
spec:
  description: Lab policy - validates signatures, SLSA provenance, and SBOM
  name: Lab
  sources:
  - name: Lab
    policy:
    - oci::quay.io/conforma/release-policy:latest@sha256:10de4ff888f9d054baeaa15c528ff74118bfd3c99ed0e5fc0ac24e72e83e01dc
    config:
      include:
      # Only include rules for what we've actually built in the lab
      - slsa_provenance_available  # SLSA provenance attestation exists
      - sbom_cyclonedx  # CycloneDX SBOM checks
      exclude:
      # Exclude checks that require additional infrastructure/data
      - sbom_spdx.hermeto_attribution_required  # Hermeto SBOM processor
      - base_image_registries  # Requires allowed_registry_prefixes data
      - step_image_registries  # Requires step registry data
