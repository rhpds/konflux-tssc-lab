---
# Quick test: Module 3 from SBOM verification onwards
# Uses existing on-push build to skip Steps 1-6

- name: "Test Module 3: SBOM Verification"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _api_url: "{{ ocp_api_url | default(openshift_api_url) }}"
    _tenant_user: "{{ tenant_user | default(user) }}"
    _use_sa_token: "{{ ocp_admin_password is not defined }}"
    component_name: sample-component-golang

  tasks:
    # =========================================================================
    # Auth setup
    # =========================================================================

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ocp_api_url is defined or openshift_api_url is defined
          - ocp_admin_password is defined or _use_sa_token | bool
          - tenant_user is defined or user is defined

    - name: Get runtime-automation SA token
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ _tenant_user }}-showroom"
        name: runtime-automation-token
      register: _ra_secret
      when: _use_sa_token | bool

    - name: Set k8s auth for runtime-automation SA
      ansible.builtin.set_fact:
        _k8s_host: "{{ _api_url }}"
        _k8s_api_key: "{{ _ra_secret.resources[0].data.token | b64decode }}"
        _k8s_validate_certs: false
      when: _use_sa_token | bool
      no_log: true

    - name: Login to OpenShift with password (CLI mode)
      ansible.builtin.command:
        cmd: >-
          oc login {{ _api_url }}
          --username admin
          --password {{ ocp_admin_password }}
          --insecure-skip-tls-verify
      changed_when: false
      no_log: true
      when: not (_use_sa_token | bool)

    - name: Set k8s auth for CLI mode
      ansible.builtin.set_fact:
        _k8s_host: ""
        _k8s_api_key: ""
        _k8s_validate_certs: true
      when: not (_use_sa_token | bool)

    # =========================================================================
    # Get Component and existing build
    # =========================================================================

    - name: Get Component
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: appstudio.redhat.com/v1alpha1
        kind: Component
        namespace: "{{ _tenant_user }}-tenant"
        name: "{{ component_name }}"
      register: r_component

    - name: Fail if Component missing
      ansible.builtin.fail:
        msg: "Component {{ component_name }} not found"
      when: r_component.resources | length == 0

    - name: Get latest on-push PipelineRun
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: tekton.dev/v1
        kind: PipelineRun
        namespace: "{{ _tenant_user }}-tenant"
        label_selectors:
          - "appstudio.openshift.io/component={{ component_name }}"
          - "pipelinesascode.tekton.dev/event-type=push"
      register: r_existing_push_runs

    - name: Fail if no builds found
      ansible.builtin.fail:
        msg: "No on-push builds found - run Module 2 first"
      when: r_existing_push_runs.resources | length == 0

    - name: Extract IMAGE_DIGEST from existing build
      ansible.builtin.set_fact:
        _image_digest: "{{ (r_existing_push_runs.resources | sort(attribute='metadata.creationTimestamp') | last).status.results | selectattr('name', 'equalto', 'IMAGE_DIGEST') | map(attribute='value') | first }}"

    - name: Get component image base
      ansible.builtin.set_fact:
        _image_base: "{{ r_component.resources[0].spec.containerImage | regex_replace(':.*$', '') }}"

    - name: Construct full image reference
      ansible.builtin.set_fact:
        _image_ref: "{{ _image_base }}@{{ _image_digest }}"

    - name: Display image reference
      ansible.builtin.debug:
        msg: "Testing SBOM for: {{ _image_ref }}"

    # =========================================================================
    # Step 7: Verify SBOM via cosign
    # =========================================================================

    - name: Get component image-pull secret
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: v1
        kind: Secret
        namespace: "{{ _tenant_user }}-tenant"
        name: "{{ component_name }}-image-pull"
      register: r_image_pull_secret

    - name: Write Docker config for cosign
      ansible.builtin.copy:
        content: "{{ r_image_pull_secret.resources[0].data['.dockerconfigjson'] | b64decode }}"
        dest: /tmp/.docker-config-{{ _tenant_user }}.json
        mode: '0600'
      when:
        - r_image_pull_secret is not failed
        - r_image_pull_secret.resources | length > 0
      no_log: true

    - name: Download SBOM via cosign
      ansible.builtin.command:
        cmd: >-
          cosign download sbom {{ _image_ref }}
          --allow-insecure-registry
      environment:
        DOCKER_CONFIG: /tmp/.docker-config-{{ _tenant_user }}.json
        COSIGN_INSECURE_SKIP_TLS_VERIFY: "true"
      register: r_cosign_sbom
      when: _image_ref is defined
      changed_when: false

    - name: Parse SBOM and count packages
      ansible.builtin.set_fact:
        _sbom_data: "{{ r_cosign_sbom.stdout | from_json }}"
        _sbom_package_count: "{{ (r_cosign_sbom.stdout | from_json).packages | default([]) | length }}"
      when:
        - r_cosign_sbom is not skipped
        - r_cosign_sbom is not failed

    - name: Fail if SBOM download failed or has no packages
      ansible.builtin.fail:
        msg: "SBOM verification failed - downloaded: {{ 'yes' if r_cosign_sbom is not skipped else 'no' }}, packages: {{ _sbom_package_count | default(0) }}"
      when: >-
        r_cosign_sbom is skipped or
        r_cosign_sbom is failed or
        _sbom_package_count is not defined or
        _sbom_package_count | int == 0

    # =========================================================================
    # Step 8: Verify image in Quay
    # =========================================================================

    - name: Verify merged MR build image in Quay
      ansible.builtin.command:
        cmd: skopeo inspect docker://{{ _image_ref }} --tls-verify=false
      register: r_skopeo_merged
      changed_when: false

    # =========================================================================
    # Cleanup
    # =========================================================================

    - name: Remove temporary Docker config
      ansible.builtin.file:
        path: /tmp/.docker-config-{{ _tenant_user }}.json
        state: absent

    # =========================================================================
    # Summary
    # =========================================================================

    - name: "Test PASSED"
      ansible.builtin.debug:
        msg: |
          ✅ SBOM Verification Test PASSED
          - Image: {{ _image_ref }}
          - SBOM packages: {{ _sbom_package_count }}
          - Quay inspection: Success
