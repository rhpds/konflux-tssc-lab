# =============================================================================
# Konflux TSSC Lab — E2E Smoke Tests (Orchestrator)
# =============================================================================
#
# Runs end-to-end tests for Modules 2-6 in sequence.
# Module 7 (Real-World Incident Response) is intentionally manual.
#
# Each module playbook simulates the student workflow and validates outcomes:
# - Module 2: Onboard application, create component, verify first PipelineRun
# - Module 3: Push commit, merge MR, verify merged build and SBOM
# - Module 4: Verify image signature, SLSA provenance, Rekor log entry
# - Module 5: Validate with Enterprise Contract policy, check Snapshot status
# - Module 6: Create release, verify production image, validate supply chain
#
# Usage:
#   ansible-playbook qa-automation/e2e.yml \
#     -e "ocp_api_url=https://api.cluster-xxx:6443" \
#     -e "ocp_admin_password=xxx" \
#     -e "tenant_user=user-abc12"
#
# To run a single module:
#   ansible-playbook qa-automation/e2e-module-02.yml -e "..."
# =============================================================================

