---
# =============================================================================
# Konflux TSSC Lab — E2E Test: Module 2 (Onboard Your Application)
# =============================================================================
#
# Simulates student workflow for Module 2:
# 1. Create Konflux Application
# 2. Create IntegrationTestScenario (auto-created by UI)
# 3. Create GitLab Personal Access Token
# 4. Create pipelines-as-code-secret in tenant namespace
# 5. Create Konflux Component linked to GitLab repo
# 6. Create ImageRepository with update-component-image annotation
# 7. Verify MR opened by Konflux (but DO NOT merge)
# 8. Wait for PipelineRun, check if any are Running after 20s
#    - If any Running: continue to wait for success
#    - If none Running: close/reopen MR, wait for new running pipeline
# 9. Verify Component containerImage was set by image-controller
#
# Usage:
#   ansible-playbook qa-automation/e2e-module-02.yml \
#     -e "ocp_api_url=https://api.cluster-xxx:6443" \
#     -e "ocp_admin_password=xxx" \
#     -e "tenant_user=user-abc12"
# =============================================================================

- name: "E2E Module 2: Onboard Your Application"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # --- Inputs ---
    _api_url: "{{ ocp_api_url | default(openshift_api_url) }}"
    _tenant_user: "{{ tenant_user | default(user) }}"
    _use_sa_token: "{{ ocp_admin_password is not defined }}"

    # --- Constants ---
    application_name: my-sample-app
    component_name: sample-component-golang
    gitlab_repo_name: sample-component-golang
    pipeline_bundle: docker-build-oci-ta-min

  tasks:
    # =========================================================================
    # Auth setup
    # =========================================================================

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ocp_api_url is defined or openshift_api_url is defined
          - ocp_admin_password is defined or _use_sa_token | bool
          - tenant_user is defined or user is defined
        fail_msg: >-
          Missing required variables.
          CLI: pass ocp_api_url, ocp_admin_password, tenant_user via -e.
          Showroom runner: openshift_api_url and user from user_data.yml.

    - name: Get runtime-automation SA token
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ _tenant_user }}-showroom"
        name: runtime-automation-token
      register: _ra_secret
      when: _use_sa_token | bool

    - name: Set k8s auth for runtime-automation SA
      ansible.builtin.set_fact:
        _k8s_host: "{{ _api_url }}"
        _k8s_api_key: "{{ _ra_secret.resources[0].data.token | b64decode }}"
        _k8s_validate_certs: false
      when: _use_sa_token | bool
      no_log: true

    - name: Login to OpenShift with password (CLI mode)
      ansible.builtin.command:
        cmd: >-
          oc login {{ _api_url }}
          --username admin
          --password {{ ocp_admin_password }}
          --insecure-skip-tls-verify
      changed_when: false
      no_log: true
      when: not (_use_sa_token | bool)

    - name: Set k8s auth for CLI mode
      ansible.builtin.set_fact:
        _k8s_host: ""
        _k8s_api_key: ""
        _k8s_validate_certs: true
      when: not (_use_sa_token | bool)

    # =========================================================================
    # Pre-conditions: Verify tenant namespace and GitLab repo exist
    # =========================================================================

    - name: Check tenant namespace exists
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: v1
        kind: Namespace
        name: "{{ _tenant_user }}-tenant"
      register: r_tenant_ns

    - name: Fail if tenant namespace missing
      ansible.builtin.fail:
        msg: "Tenant namespace {{ _tenant_user }}-tenant not found — environment not provisioned"
      when: r_tenant_ns.resources | length == 0

    - name: Get GitLab route
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: route.openshift.io/v1
        kind: Route
        namespace: gitlab
        name: gitlab
      register: r_gitlab_route

    - name: Set GitLab URL
      ansible.builtin.set_fact:
        _gitlab_url: "https://{{ r_gitlab_route.resources[0].spec.host }}"
        _gitlab_host: "{{ r_gitlab_route.resources[0].spec.host }}"
      when: r_gitlab_route.resources | length > 0

    - name: Get GitLab root user personal access token
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: v1
        kind: Secret
        namespace: gitlab
        name: root-user-personal-token
      register: r_gitlab_token_secret

    - name: Set GitLab root token
      ansible.builtin.set_fact:
        _gitlab_root_token: "{{ r_gitlab_token_secret.resources[0].data.token | b64decode }}"
      when: r_gitlab_token_secret.resources | default([]) | length > 0
      no_log: true

    - name: Check GitLab repository exists
      ansible.builtin.uri:
        url: "{{ _gitlab_url }}/api/v4/projects/{{ _tenant_user }}%2F{{ gitlab_repo_name }}"
        method: GET
        headers:
          PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
        validate_certs: false
        status_code: [200, 404]
      register: r_gitlab_repo_check
      ignore_errors: true

    - name: Fail if GitLab repo missing
      ansible.builtin.fail:
        msg: "GitLab repository {{ _tenant_user }}/{{ gitlab_repo_name }} not found"
      when: r_gitlab_repo_check.status | default(0) != 200

    # =========================================================================
    # Step 1: Create Konflux Application
    # =========================================================================

    - name: Create Konflux Application
      kubernetes.core.k8s:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        state: present
        definition:
          apiVersion: appstudio.redhat.com/v1alpha1
          kind: Application
          metadata:
            name: "{{ application_name }}"
            namespace: "{{ _tenant_user }}-tenant"
          spec:
            displayName: "{{ application_name }}"
      register: r_create_app

    - name: Verify Application was created
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: appstudio.redhat.com/v1alpha1
        kind: Application
        namespace: "{{ _tenant_user }}-tenant"
        name: "{{ application_name }}"
      register: r_verify_app
      failed_when: r_verify_app.resources | length == 0

    - name: Create IntegrationTestScenario
      kubernetes.core.k8s:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        state: present
        definition:
          apiVersion: appstudio.redhat.com/v1beta2
          kind: IntegrationTestScenario
          metadata:
            name: "{{ application_name }}-enterprise-contract"
            namespace: "{{ _tenant_user }}-tenant"
            annotations:
              test.appstudio.openshift.io/kind: enterprise-contract
            ownerReferences:
              - apiVersion: appstudio.redhat.com/v1alpha1
                blockOwnerDeletion: false
                controller: false
                kind: Application
                name: "{{ application_name }}"
                uid: "{{ r_verify_app.resources[0].metadata.uid }}"
          spec:
            application: "{{ application_name }}"
            resolverRef:
              resolver: git
              resourceKind: pipeline
              params:
                - name: url
                  value: https://github.com/rhpds/konflux-tssc-lab.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: tekton/pipelines/enterprise-contract-low-resources.yaml
      register: r_create_its

    # =========================================================================
    # Step 2: Create GitLab Personal Access Token for tenant user
    # =========================================================================

    - name: Get tenant user ID from GitLab
      ansible.builtin.uri:
        url: "{{ _gitlab_url }}/api/v4/users?username={{ _tenant_user }}"
        method: GET
        headers:
          PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
        validate_certs: false
      register: r_gitlab_user
      failed_when:
        - r_gitlab_user.json is not defined or r_gitlab_user.json | length == 0

    - name: Set tenant user ID
      ansible.builtin.set_fact:
        _tenant_user_id: "{{ r_gitlab_user.json[0].id }}"

    - name: Calculate PAT expiration date (30 days from now)
      ansible.builtin.command:
        cmd: python3 -c "from datetime import datetime, timedelta; print((datetime.now() + timedelta(days=30)).strftime('%Y-%m-%d'))"
      register: r_pat_date
      changed_when: false

    - name: Set PAT expiration date
      ansible.builtin.set_fact:
        _pat_expires_at: "{{ r_pat_date.stdout }}"

    - name: Create GitLab PAT for tenant user
      ansible.builtin.uri:
        url: "{{ _gitlab_url }}/api/v4/users/{{ _tenant_user_id }}/personal_access_tokens"
        method: POST
        headers:
          PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
        body_format: json
        body:
          name: konflux-pac-e2e
          scopes:
            - api
          expires_at: "{{ _pat_expires_at }}"
        validate_certs: false
        status_code: [201]
      register: r_create_pat

    - name: Set tenant PAT
      ansible.builtin.set_fact:
        _tenant_gitlab_pat: "{{ r_create_pat.json.token }}"
      no_log: true

    # =========================================================================
    # Step 3: Create pipelines-as-code-secret
    # =========================================================================

    - name: Create pipelines-as-code-secret
      kubernetes.core.k8s:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: pipelines-as-code-secret
            namespace: "{{ _tenant_user }}-tenant"
            labels:
              appstudio.redhat.com/credentials: scm
              appstudio.redhat.com/scm.host: "{{ _gitlab_host }}"
          type: kubernetes.io/basic-auth
          stringData:
            password: "{{ _tenant_gitlab_pat }}"
      register: r_create_pac_secret

    # =========================================================================
    # Step 4: Create Konflux Component
    # =========================================================================

    - name: Create Konflux Component
      kubernetes.core.k8s:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        state: present
        definition:
          apiVersion: appstudio.redhat.com/v1alpha1
          kind: Component
          metadata:
            name: "{{ component_name }}"
            namespace: "{{ _tenant_user }}-tenant"
            annotations:
              build.appstudio.openshift.io/pipeline: '{"name":"{{ pipeline_bundle }}","bundle":"latest"}'
              git-provider: gitlab
              git-provider-url: "{{ _gitlab_url }}"
          spec:
            actions:
              create-pipeline-configuration-pr: {}
            application: "{{ application_name }}"
            componentName: "{{ component_name }}"
            source:
              git:
                url: "{{ _gitlab_url }}/{{ _tenant_user }}/{{ gitlab_repo_name }}.git"
      register: r_create_component

    - name: Wait for Component to be created
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: appstudio.redhat.com/v1alpha1
        kind: Component
        namespace: "{{ _tenant_user }}-tenant"
        name: "{{ component_name }}"
      register: r_verify_component
      until: r_verify_component.resources | length > 0
      retries: 6
      delay: 5

    - name: Create ImageRepository for Component
      kubernetes.core.k8s:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        state: present
        definition:
          apiVersion: appstudio.redhat.com/v1alpha1
          kind: ImageRepository
          metadata:
            name: "{{ component_name }}"
            namespace: "{{ _tenant_user }}-tenant"
            annotations:
              image-controller.appstudio.redhat.com/update-component-image: "true"
            labels:
              appstudio.redhat.com/application: "{{ application_name }}"
              appstudio.redhat.com/component: "{{ component_name }}"
            ownerReferences:
              - apiVersion: appstudio.redhat.com/v1alpha1
                kind: Component
                name: "{{ component_name }}"
                uid: "{{ r_verify_component.resources[0].metadata.uid }}"
          spec:
            image:
              name: "{{ _tenant_user }}-tenant/{{ component_name }}"
              visibility: private
      register: r_create_imagerepository

    # =========================================================================
    # Step 5: Wait for Konflux to open MR (adds .tekton/ directory)
    # =========================================================================

    - name: Wait 30 seconds for Konflux to open MR
      ansible.builtin.pause:
        seconds: 30

    - name: Get project ID for tenant repository
      ansible.builtin.uri:
        url: "{{ _gitlab_url }}/api/v4/projects/{{ _tenant_user }}%2F{{ gitlab_repo_name }}"
        method: GET
        headers:
          PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
        validate_certs: false
      register: r_gitlab_project

    - name: Set GitLab project ID
      ansible.builtin.set_fact:
        _gitlab_project_id: "{{ r_gitlab_project.json.id }}"

    - name: Check for open MR from Konflux
      ansible.builtin.uri:
        url: "{{ _gitlab_url }}/api/v4/projects/{{ _gitlab_project_id }}/merge_requests?state=opened"
        method: GET
        headers:
          PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
        validate_certs: false
      register: r_gitlab_mrs
      retries: 10
      delay: 5
      until:
        - r_gitlab_mrs.json is defined
        - r_gitlab_mrs.json | length > 0

    # =========================================================================
    # Step 6: Wait for first PipelineRun (on-pull-request)
    # =========================================================================

    - name: Wait for first PipelineRun to appear
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: tekton.dev/v1
        kind: PipelineRun
        namespace: "{{ _tenant_user }}-tenant"
        label_selectors:
          - "appstudio.openshift.io/component={{ component_name }}"
      register: r_first_pipelinerun
      until: r_first_pipelinerun.resources | length > 0
      retries: 30
      delay: 10

    - name: Wait 20 seconds for PipelineRuns to start or get cancelled
      ansible.builtin.pause:
        seconds: 20

    - name: Check all PipelineRun statuses after 20s
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: tekton.dev/v1
        kind: PipelineRun
        namespace: "{{ _tenant_user }}-tenant"
        label_selectors:
          - "appstudio.openshift.io/component={{ component_name }}"
      register: r_check_all_status

    - name: Check if any PipelineRun is in Running state
      ansible.builtin.set_fact:
        _running_pipelines: "{{ r_check_all_status.resources | selectattr('status.startTime', 'defined') | rejectattr('status.completionTime', 'defined') | list }}"

    - name: Determine if any pipeline is running
      ansible.builtin.set_fact:
        _any_running: "{{ _running_pipelines | length > 0 }}"

    - name: Set first running PipelineRun name if any are running
      ansible.builtin.set_fact:
        _first_pipelinerun_name: "{{ _running_pipelines[0].metadata.name }}"
      when: _any_running | bool

    - name: Handle no running pipelines by closing and reopening MR
      when: not (_any_running | default(true) | bool)
      block:
        - name: Get MR IID
          ansible.builtin.set_fact:
            _mr_iid: "{{ r_gitlab_mrs.json[0].iid }}"

        - name: Close MR
          ansible.builtin.uri:
            url: "{{ _gitlab_url }}/api/v4/projects/{{ _gitlab_project_id }}/merge_requests/{{ _mr_iid }}?state_event=close"
            method: PUT
            headers:
              PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
            validate_certs: false
            status_code: [200]

        - name: Reopen MR to trigger new pipeline
          ansible.builtin.uri:
            url: "{{ _gitlab_url }}/api/v4/projects/{{ _gitlab_project_id }}/merge_requests/{{ _mr_iid }}?state_event=reopen"
            method: PUT
            headers:
              PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
            validate_certs: false
            status_code: [200]

        - name: Wait for new running PipelineRun after MR reopen
          kubernetes.core.k8s_info:
            host: "{{ _k8s_host | default(omit, true) }}"
            api_key: "{{ _k8s_api_key | default(omit, true) }}"
            validate_certs: "{{ _k8s_validate_certs }}"
            api_version: tekton.dev/v1
            kind: PipelineRun
            namespace: "{{ _tenant_user }}-tenant"
            label_selectors:
              - "appstudio.openshift.io/component={{ component_name }}"
          register: r_new_pipelinerun
          until:
            - r_new_pipelinerun.resources | selectattr('status.startTime', 'defined') | rejectattr('status.completionTime', 'defined') | list | length > 0
          retries: 30
          delay: 5

        - name: Set new running PipelineRun name
          ansible.builtin.set_fact:
            _first_pipelinerun_name: "{{ (r_new_pipelinerun.resources | selectattr('status.startTime', 'defined') | rejectattr('status.completionTime', 'defined') | list | first).metadata.name }}"

    - name: Wait for PipelineRun to complete
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: tekton.dev/v1
        kind: PipelineRun
        namespace: "{{ _tenant_user }}-tenant"
        name: "{{ _first_pipelinerun_name }}"
      register: r_pipelinerun_status
      until:
        - r_pipelinerun_status.resources[0].status.conditions is defined
        - r_pipelinerun_status.resources[0].status.conditions | selectattr('type', 'equalto', 'Succeeded') | list | length > 0
        - r_pipelinerun_status.resources[0].status.conditions | selectattr('type', 'equalto', 'Succeeded') | selectattr('status', 'equalto', 'True') | list | length > 0
      retries: 90
      delay: 20

    # =========================================================================
    # Step 7: Verify image in Quay
    # =========================================================================

    - name: Get Component containerImage reference
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: appstudio.redhat.com/v1alpha1
        kind: Component
        namespace: "{{ _tenant_user }}-tenant"
        name: "{{ component_name }}"
      register: r_component_image

    - name: Set component image reference
      ansible.builtin.set_fact:
        _component_image: "{{ r_component_image.resources[0].spec.containerImage }}"

    - name: Verify containerImage was set by image-controller
      ansible.builtin.fail:
        msg: "Component containerImage not set - image-controller may not have updated it"
      when:
        - _component_image is not defined or _component_image | length == 0

    # =========================================================================
    # Summary
    # =========================================================================

    - name: "E2E Module 2 — Test Passed"
      ansible.builtin.debug:
        msg: |
          ✅ Module 2 E2E Test PASSED
          - Application created: {{ application_name }}
          - IntegrationTestScenario created: {{ application_name }}-enterprise-contract
          - GitLab PAT created for: {{ _tenant_user }}
          - PAC secret created
          - Component created: {{ component_name }}
          - ImageRepository created with update annotation
          - Component containerImage set by image-controller
          - MR opened by Konflux
          - PipelineRun: {{ _first_pipelinerun_name }}
          - Running pipeline found: {{ _any_running | default(false) }}
          - MR close/reopen triggered: {{ not (_any_running | default(true) | bool) }}
          - PipelineRun status: Succeeded
          - Component containerImage set: {{ _component_image }}
