  description: "# Build, Sign, and Ship: Securing the Software Supply Chain with Konflux\
    \  Modern software supply chains demand more than just building and deploying\
    \ code \u2014 they require cryptographic proof of provenance, automated vulnerability\
    \ scanning, and policy-enforced releases. In this 2-hour hands-on lab, you'll\
    \ experience the complete secure software lifecycle using **Konflux**, Red Hat's\
    \ next-generation build and release platform.  Working in your own tenant workspace\
    \ on a shared OpenShift cluster, you'll onboard a real application from a GitLab\
    \ repository, trigger automated builds via Pipelines-as-Code, and watch Konflux\
    \ generate SBOMs, sign your artifacts with **Trusted Artifact Signer**, and produce\
    \ SLSA Level 3 provenance attestations \u2014 all without writing a single pipeline.\
    \ You'll then verify your supply chain integrity using **Conforma** policy checks\
    \ and promote your application through a controlled release pipeline to a production\
    \ namespace, with images pushed to a self-hosted **Quay** registry.  By the end\
    \ of this lab, you'll understand how Konflux connects build, sign, scan, and release\
    \ into a single automated workflow \u2014 and how your organization can adopt\
    \ it to meet increasingly strict software supply chain security requirements.\
    \  **Products:** Konflux, Red Hat Trusted Artifact Signer, Red Hat Quay, OpenShift\
    \ Pipelines, GitLab "
  jira_ticket: RHDPCD-1039
  workflow_id: 6fbed8db-46a2-4303-bc59-77e12490c2f4
spec:
  title: 'Build, Sign, and Ship: Securing the Software Supply Chain with Konflux'
  learning_objectives:
  - Configure an application in Konflux and connect it to automated Pipelines-as-Code
    builds triggered from GitLab
  - Build a container image and analyze the SBOM in CycloneDX format generated automatically
    by the Konflux pipeline
  - Verify cryptographic image signatures and SLSA Level 3 provenance attestations
    using cosign and Trusted Artifact Signer
  - Analyze Conforma policy checks and observe how failed checks block artifact promotion
    between environments
  - Deploy a policy-verified, signed artifact through a controlled release pipeline
    to a production Quay registry
  - Verify end-to-end supply chain integrity from source commit to signed, provenance-attested
    production release
  modules:
  - id: module-01
    title: Orientation
    duration_min: 15
    status: not_started
