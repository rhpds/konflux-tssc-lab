# Automation Manifest
# Describes what the lab/demo environment needs pre-configured.
# Based on LB1353 Konflux TSSC Lab implementation
# Reference: https://github.com/rhpds/agnosticv/tree/master/rh1-2027/lb1353-konflux-tsf-tssc-cnv-*

approach: ansible

infrastructure:
  type: sandbox-tenant
  ocp_version: "4.21"
  multi_user: true
  users_per_deployment: 1
  topology: shared-cluster
  cluster_type: multinode
  worker_count: 6

# Operators installed at cluster level (via cluster workload)
operators:
  - name: openshift-gitops-operator
    namespace: openshift-operators
    channel: gitops-1.15
    notes: ArgoCD for GitOps workflows

  - name: quay-operator
    namespace: quay-registry
    channel: stable-3.16
    notes: Container registry with S4 object storage backend

  - name: rhtas-operator
    namespace: tsf-tas
    notes: Red Hat Trusted Artifact Signer (installed via TSF)

  - name: konflux
    namespace: konflux-ui
    notes: Konflux UI and backend (installed via TSF)

  - name: rhsso-operator
    namespace: tsf-keycloak
    notes: Keycloak for authentication (installed via TSF)

# Applications installed at cluster level
applications:
  - name: GitLab
    namespace: gitlab
    type: deployment
    notes: Source control with native auth, GitLab Runners enabled
    config:
      root_password: common_admin_password
      runner_enabled: true
      auth_mode: native

  - name: S4
    namespace: s4
    type: statefulset
    notes: Object storage (MinIO) for Quay backend
    config:
      buckets:
        - quay-registry
      storage: 20Gi
      auth_enabled: true

  - name: Quay Registry
    namespace: quay-registry
    type: quayregistry
    notes: Enterprise container registry
    config:
      s4_storage: true
      admin_user: quayadmin

  - name: Trusted Software Factory
    namespace: tsf
    type: helm
    notes: Installs Konflux, RHTAS, TPA, Keycloak, Pipeline-as-Code
    components:
      - Konflux (konflux-ui namespace)
      - RHTAS (tsf-tas namespace)
      - Trusted Profile Analyzer (tsf-tpa namespace)
      - Keycloak (tsf-keycloak namespace)
      - Pipeline-as-Code controller
    integrations:
      - GitLab (group: tsf)
      - Quay (organization: tsf)

  - name: Showroom Lab Guide
    namespace: user-{guid}-showroom
    type: deployment
    notes: Per-user lab guide with embedded terminal (Wetty)
    config:
      git_repo: https://github.com/rhpds/konflux-tssc-lab.git
      terminal_type: wetty
      ssh_bastion_login: true

# RBAC configurations
rbac:
  - type: ClusterRole
    name: konflux-admin-user-actions
    notes: Permissions for Konflux Application, Component, ReleasePlan, etc.
    rules:
      - apiGroups: ["appstudio.redhat.com"]
        resources:
          - applications
          - components
          - releaseplans
          - releases
          - integrationtestscenarios
          - environments
        verbs: ["*"]
      - apiGroups: ["tekton.dev"]
        resources:
          - pipelineruns
          - pipelines
          - tasks
          - taskruns
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources:
          - secrets
          - configmaps
        verbs: ["*"]

  - type: RoleBinding
    name: konflux-admin
    namespace: user-{guid}-tenant
    notes: Bind lab user to konflux-admin-user-actions ClusterRole
    subjects:
      - kind: User
        name: user-{guid}
    roleRef:
      kind: ClusterRole
      name: konflux-admin-user-actions

  - type: RoleBinding
    name: konflux-admin
    namespace: user-{guid}-managed
    notes: Bind lab user to konflux-admin-user-actions in managed namespace
    subjects:
      - kind: User
        name: user-{guid}
    roleRef:
      kind: ClusterRole
      name: konflux-admin-user-actions

# Seed data for lab exercises
seed_data:
  - type: gitlab_repository
    target: user-{guid} personal namespace
    source: https://github.com/konflux-ci/sample-component-golang.git
    name: sample-component-golang
    visibility: private
    notes: Golang sample application for onboarding into Konflux

  - type: gitlab_group_membership
    group: tsf
    user: user-{guid}
    access_level: developer
    notes: Add user to shared TSF group

  - type: quay_user
    username: user-{guid}
    email: user-{guid}@example.com
    password: common_password
    notes: Quay user account for image registry

  - type: htpasswd_user
    username: user-{guid}
    password: common_password
    notes: OpenShift authentication via HTPasswd

# Provision data (propagated to user)
provision_data:
  - name: konflux_ui_url
    description: Konflux web console URL
    source: route/konflux-ui/konflux-ui

  - name: keycloak_url
    description: Keycloak authentication URL
    source: route/keycloak/tsf-keycloak

  - name: gitlab_url
    description: GitLab URL
    source: route/gitlab/gitlab

  - name: gitlab_username
    description: GitLab username
    value: user-{guid}

  - name: gitlab_password
    description: GitLab password
    value: common_password

  - name: quay_url
    description: Quay registry URL
    source: quayregistry/quay/quay-registry

  - name: quay_user
    description: Quay username
    value: user-{guid}

  - name: quay_password
    description: Quay password
    value: common_password

  - name: tas_rekor_url
    description: RHTAS Rekor transparency log URL
    source: route/rekor-server/tsf-tas

  - name: tas_fulcio_url
    description: RHTAS Fulcio certificate authority URL
    source: route/fulcio-server/tsf-tas

  - name: tpa_url
    description: Trusted Profile Analyzer URL
    source: route/trustification-ui/tsf-tpa

  - name: tenant_namespace
    description: User's Konflux tenant namespace
    value: user-{guid}-tenant

  - name: managed_namespace
    description: User's managed workload namespace
    value: user-{guid}-managed

# Network requirements
network:
  - type: external_services
    urls:
      - registry.access.redhat.com
      - quay.io
      - github.com
    notes: Required for pulling images and cloning repositories

# Notes
notes: |
  This lab provisions a complete Konflux software supply chain security environment
  using the Trusted Software Factory (TSF) installer.

  Architecture:
  - Cluster-level: S4 storage, Quay, GitLab, TSF (Konflux + RHTAS + TPA + Keycloak)
  - Per-user: Two namespaces (tenant + managed), GitLab repo, Quay account, RBAC

  Key Collections:
  - rhpds.ads (ocp4_workload_trusted_software_factory) - Installs TSF via tsf CLI
  - core_workloads (S4, Quay, GitLab, GitOps) - Standard infrastructure
  - namespaced_workloads (tenant namespace/GitLab/Quay setup) - Per-user resources
  - konflux_tssc_lab.automation (custom RBAC + URL collection) - Lab-specific configs

  Custom Implementation (minimal):
  - ocp4_workload_konflux_tssc_cluster: ~100 lines (ClusterRole + save URLs)
  - ocp4_workload_konflux_tssc_tenant: ~150 lines (RoleBindings + Showroom orchestration)

  Infrastructure Provisioning:
  - AgnosticV cluster catalog item calls existing workloads for all infrastructure
  - AgnosticV tenant catalog item calls namespaced_workloads + custom role
  - TSF CLI auto-installs: Konflux, RHTAS, TPA, Keycloak, Tekton Chains, Pipeline-as-Code

  Implementation based on:
  - https://github.com/rhpds/agnosticv/tree/master/rh1-2027/lb1353-konflux-tsf-tssc-cnv-cluster
  - https://github.com/rhpds/agnosticv/tree/master/rh1-2027/lb1353-konflux-tsf-tssc-cnv-tenant

  What Students Do (NOT pre-configured):
  - Module 02: Create Konflux Application and Component
  - Module 06: Create ReleasePlan and Release
  - All other Konflux resources auto-created by controllers
