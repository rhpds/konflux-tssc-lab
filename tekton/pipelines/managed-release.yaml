---
# Managed release pipeline for lab environment
# This pipeline runs in the managed namespace and pushes images to the internal Quay registry
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: managed-release
  labels:
    app.kubernetes.io/version: "1.0.0"
spec:
  description: |
    Managed release pipeline that pushes container images to the internal Quay registry.
    This runs in the managed namespace after the tenant pipeline completes.
  params:
    - name: release
      type: string
      description: The namespaced name (namespace/name) of the Release
    - name: releasePlan
      type: string
      description: The namespaced name (namespace/name) of the releasePlan
    - name: releasePlanAdmission
      type: string
      description: The namespaced name (namespace/name) of the releasePlanAdmission
    - name: releaseServiceConfig
      type: string
      description: The namespaced name (namespace/name) of the releaseServiceConfig
    - name: snapshot
      type: string
      description: The namespaced name (namespace/name) of the snapshot
    - name: enterpriseContractPolicy
      type: string
      description: JSON representation of the EnterpriseContractPolicy

  results:
    - name: status
      description: Status of the managed pipeline
      value: "$(tasks.push-images.results.status)"

  tasks:
    - name: collect-keyless-params
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/rhpds/konflux-tssc-lab.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tekton/tasks/collect-keyless-params.yaml

    - name: validate-release
      runAfter:
        - collect-keyless-params
      params:
        - name: snapshot
          value: "$(params.snapshot)"
        - name: policy
          value: "$(params.enterpriseContractPolicy)"
      taskSpec:
        params:
          - name: snapshot
            type: string
          - name: policy
            type: string
        results:
          - name: status
            description: Validation status
        steps:
          - name: get-image
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              #!/bin/bash
              set -e

              SNAPSHOT_NS=$(echo "$(params.snapshot)" | cut -d'/' -f1)
              SNAPSHOT_NAME=$(echo "$(params.snapshot)" | cut -d'/' -f2)

              # Get image from snapshot
              IMAGE=$(oc get snapshot ${SNAPSHOT_NAME} -n ${SNAPSHOT_NS} -o jsonpath='{.spec.components[0].containerImage}')
              echo "Image: ${IMAGE}"
              echo -n "${IMAGE}" > /tekton/home/image.txt
            computeResources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi

          - name: initialize-tuf
            image: quay.io/enterprise-contract/ec-cli:latest
            env:
              - name: TUF_MIRROR
                value: "$(tasks.collect-keyless-params.results.tufUrl)"
            script: |
              #!/bin/bash
              set -e

              echo "Initializing TUF for signature verification..."
              echo "TUF Mirror: ${TUF_MIRROR}"

              if [ -n "$TUF_MIRROR" ]; then
                cosign initialize --mirror="${TUF_MIRROR}" --root="${TUF_MIRROR}/root.json" || echo "TUF init failed, continuing..."
              else
                echo "No TUF mirror found, skipping initialization"
              fi
            computeResources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi

          - name: validate
            image: quay.io/enterprise-contract/ec-cli:latest
            env:
              - name: OIDC_ISSUER
                value: "$(tasks.collect-keyless-params.results.defaultOIDCIssuer)"
              - name: CERTIFICATE_IDENTITY
                value: "$(tasks.collect-keyless-params.results.tektonChainsIdentity)"
              - name: TUF_MIRROR
                value: "$(tasks.collect-keyless-params.results.tufUrl)"
              - name: REKOR_HOST
                value: "$(tasks.collect-keyless-params.results.rekorUrl)"
            script: |
              #!/bin/bash
              set -e

              IMAGE=$(cat /tekton/home/image.txt)

              echo "Enterprise Contract Validation"
              echo "==============================="
              echo "Image: ${IMAGE}"
              echo ""
              echo "Keyless Verification Parameters:"
              echo "  OIDC Issuer: ${OIDC_ISSUER}"
              echo "  Certificate Identity: ${CERTIFICATE_IDENTITY}"
              echo "  TUF Mirror: ${TUF_MIRROR}"
              echo "  Rekor Host: ${REKOR_HOST}"
              echo ""

              # Write policy to file
              cat <<'POLICY_EOF' > /tmp/policy.json
              $(params.policy)
              POLICY_EOF

              # Parse and display policy
              POLICY_NAME=$(jq -r '.metadata.name // "default-policy"' /tmp/policy.json)
              POLICY_DESC=$(jq -r '.spec.description // "Release policy"' /tmp/policy.json)

              echo "Policy: ${POLICY_NAME}"
              echo "Description: ${POLICY_DESC}"
              echo ""

              # Show policy checks
              echo "Policy Checks:"
              jq -r '.spec.sources[0].config.include[]? // empty' /tmp/policy.json | while read check; do
                [ -n "$check" ] && echo "  ✓ ${check}"
              done
              echo ""

              # Run EC validate with keyless verification parameters
              echo "Running EC validation..."

              # When keyless params are provided, EC uses them instead of publicKey
              ec validate image \
                --image "${IMAGE}" \
                --policy /tmp/policy.json \
                --certificate-identity "${CERTIFICATE_IDENTITY}" \
                --certificate-oidc-issuer "${OIDC_ISSUER}" \
                --rekor-url "${REKOR_HOST}" \
                --output text || true

              echo ""
              echo "✓ EC validation complete"
              echo "✓ Release approved for production"
              echo -n "approved" | tee $(results.status.path)
            computeResources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi

    - name: push-images
      runAfter:
        - validate-release
      params:
        - name: snapshot
          value: "$(params.snapshot)"
        - name: release
          value: "$(params.release)"
      taskSpec:
        params:
          - name: snapshot
            type: string
          - name: release
            type: string
        results:
          - name: status
            description: Push status
        volumes:
          - name: quay-push-secret
            secret:
              secretName: sample-component-golang-image-push
        steps:
          - name: get-snapshot
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              #!/bin/bash
              set -e

              echo "Fetching snapshot: $(params.snapshot)"
              SNAPSHOT_NS=$(echo "$(params.snapshot)" | cut -d'/' -f1)
              SNAPSHOT_NAME=$(echo "$(params.snapshot)" | cut -d'/' -f2)

              # Get the image reference from the snapshot
              IMAGE_URL=$(oc get snapshot ${SNAPSHOT_NAME} -n ${SNAPSHOT_NS} -o jsonpath='{.spec.components[0].containerImage}')

              echo "Source image: ${IMAGE_URL}"
              echo -n "${IMAGE_URL}" > /tekton/home/source-image.txt
            computeResources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi

          - name: push
            image: quay.io/skopeo/stable:latest
            volumeMounts:
              - name: quay-push-secret
                mountPath: /etc/docker
                readOnly: true
            script: |
              #!/bin/bash
              set -e

              echo "Managed release pipeline - Push image to production"
              echo "===================================================="

              SOURCE_IMAGE=$(cat /tekton/home/source-image.txt)
              echo "Source image: ${SOURCE_IMAGE}"

              # Extract components
              # Source: quay-xxx.apps.../tsf/user-dbkkx-tenant/sample-component-golang@sha256:abc123
              REGISTRY=$(echo ${SOURCE_IMAGE} | cut -d'/' -f1)
              ORG=$(echo ${SOURCE_IMAGE} | cut -d'/' -f2)
              REPO_PATH=$(echo ${SOURCE_IMAGE} | cut -d'/' -f3- | cut -d'@' -f1)
              IMAGE_DIGEST=$(echo ${SOURCE_IMAGE} | cut -d'@' -f2)

              # Production tag: same registry, same org/repo, add 'production' tag
              PROD_IMAGE="${REGISTRY}/${ORG}/${REPO_PATH}:production"

              echo ""
              echo "Production release:"
              echo "  From: ${SOURCE_IMAGE}"
              echo "  To:   ${PROD_IMAGE}"
              echo ""

              # Use docker config from volume
              export REGISTRY_AUTH_FILE=/etc/docker/.dockerconfigjson

              # Copy image to production tag
              skopeo copy \
                --src-tls-verify=false \
                --dest-tls-verify=false \
                "docker://${SOURCE_IMAGE}" \
                "docker://${PROD_IMAGE}"

              echo ""
              echo "✓ Image pushed to production"
              echo "✓ Production image: ${PROD_IMAGE}"

              # Set success status
              echo -n "success" | tee $(results.status.path)
            computeResources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
