---
# Managed release pipeline for lab environment
# This pipeline runs in the managed namespace and pushes images to the internal Quay registry
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: managed-release
  labels:
    app.kubernetes.io/version: "1.0.0"
spec:
  description: |
    Managed release pipeline that pushes container images to the internal Quay registry.
    This runs in the managed namespace after the tenant pipeline completes.
  params:
    - name: release
      type: string
      description: The namespaced name (namespace/name) of the Release
    - name: releasePlan
      type: string
      description: The namespaced name (namespace/name) of the releasePlan
    - name: releasePlanAdmission
      type: string
      description: The namespaced name (namespace/name) of the releasePlanAdmission
    - name: releaseServiceConfig
      type: string
      description: The namespaced name (namespace/name) of the releaseServiceConfig
    - name: snapshot
      type: string
      description: The namespaced name (namespace/name) of the snapshot

  results:
    - name: status
      description: Status of the managed pipeline
      value: "$(tasks.push-images.results.status)"

  tasks:
    - name: push-images
      params:
        - name: snapshot
          value: "$(params.snapshot)"
        - name: release
          value: "$(params.release)"
      taskSpec:
        params:
          - name: snapshot
            type: string
          - name: release
            type: string
        results:
          - name: status
            description: Push status
        steps:
          - name: get-snapshot
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              #!/bin/bash
              set -e

              echo "Fetching snapshot: $(params.snapshot)"
              SNAPSHOT_NS=$(echo "$(params.snapshot)" | cut -d'/' -f1)
              SNAPSHOT_NAME=$(echo "$(params.snapshot)" | cut -d'/' -f2)

              # Get the image reference from the snapshot
              IMAGE_URL=$(oc get snapshot ${SNAPSHOT_NAME} -n ${SNAPSHOT_NS} -o jsonpath='{.spec.components[0].containerImage}')

              echo "Source image: ${IMAGE_URL}"
              echo -n "${IMAGE_URL}" > /workspace/source-image.txt
            computeResources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi

          - name: push
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              #!/bin/bash
              set -e

              echo "Managed release pipeline - Tag image for production"
              echo "===================================================="

              SOURCE_IMAGE=$(cat /workspace/source-image.txt)
              echo "Source image: ${SOURCE_IMAGE}"

              # Extract components
              # Source: quay-xxx.apps.../tsf/my-sample-app@sha256:abc123
              REGISTRY=$(echo ${SOURCE_IMAGE} | cut -d'/' -f1)
              ORG=$(echo ${SOURCE_IMAGE} | cut -d'/' -f2)
              IMAGE_NAME=$(echo ${SOURCE_IMAGE} | cut -d'/' -f3 | cut -d'@' -f1)
              IMAGE_DIGEST=$(echo ${SOURCE_IMAGE} | cut -d'@' -f2)

              # Production tag: same repo, but with 'production' tag
              PROD_IMAGE="${REGISTRY}/${ORG}/${IMAGE_NAME}:production"

              echo ""
              echo "Production release:"
              echo "  Repository: ${REGISTRY}/${ORG}/${IMAGE_NAME}"
              echo "  Source:     ${IMAGE_DIGEST}"
              echo "  Tag:        production"
              echo ""

              echo "✓ Release approved for production"
              echo "✓ Production image: ${PROD_IMAGE}"
              echo ""
              echo "Note: Image already exists in registry with digest ${IMAGE_DIGEST}"
              echo "      In a real deployment, this would be tagged as 'production'"
              echo "      or pushed to a separate production organization."

              # Set success status
              echo -n "success" | tee $(results.status.path)
            computeResources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi
