apiVersion: tekton.dev/v1
kind: Task
metadata:
  annotations:
    tekton.dev/displayName: Verify Conforma
    tekton.dev/pipelines.minVersion: '0.19'
    tekton.dev/tags: ec, chains, signature, conftest
  labels:
    app.kubernetes.io/version: '0.1'
  name: verify-enterprise-contract
spec:
  description: Verify the Conforma policy is met
  params:
  - description: "Spec section of an ApplicationSnapshot resource. Not all fields of the\nresource are required. A minimal example:\n\n```json\n  {\n    \"components\": [\n      {\n        \"containerImage\": \"quay.io/example/repo:latest\"\n      }\n    ]\n  }\n```\n\nEach `containerImage` in the `components` array is validated.\n"
    name: IMAGES
    type: string
  - default: enterprise-contract-service/default
    description: 'Name of the policy configuration (EnterpriseContractPolicy

      resource) to use. `namespace/name` or `name` syntax supported. If

      namespace is omitted the namespace where the task runs is used.

      You can also specify a policy configuration using a git url, e.g.

      `github.com/conforma/config//slsa3`.

      '
    name: POLICY_CONFIGURATION
    type: string
  - default: ''
    description: Public key used to verify traditional long-lived signatures. Must be a valid k8s cosign reference, e.g. k8s://my-space/my-secret where my-secret contains the expected cosign.pub attribute. Required for traditional signing key verification. Will be ignored if any of CERTIFICATE_IDENTITY, CERTIFICATE_IDENTITY_REGEXP, CERTIFICATE_OIDC_ISSUER, or CERTIFICATE_OIDC_ISSUER_REGEXP are provided.
    name: PUBLIC_KEY
    type: string
  - default: ''
    description: Rekor host for transparency log lookups
    name: REKOR_HOST
    type: string
  - default: ''
    description: Expected identity in the signing certificate for keyless verification. This should be the email or URI that was used when signing. You should provide both CERTIFICATE_OIDC_ISSUER and CERTIFICATE_IDENTITY for keyless verification. The PUBLIC_KEY param will be ignored if this is provided.
    name: CERTIFICATE_IDENTITY
    type: string
  - default: ''
    description: Expected OIDC issuer in the signing certificate for keyless verification. This should match the issuer that provided the identity token used for signing. You should provide both CERTIFICATE_OIDC_ISSUER and CERTIFICATE_IDENTITY for keyless verification. The PUBLIC_KEY param will be ignored if this is provided.
    name: CERTIFICATE_OIDC_ISSUER
    type: string
  - default: ''
    description: Similar to CERTIFICATE_IDENTITY but the value is a regexp that will be matched. Note that CERTIFICATE_IDENTITY takes precedence over this if both are present.
    name: CERTIFICATE_IDENTITY_REGEXP
    type: string
  - default: ''
    description: Similar to CERTIFICATE_OIDC_ISSUER but a regexp that will be matched. Note that CERTIFICATE_OIDC_ISSUER takes precedence over this if both are present.
    name: CERTIFICATE_OIDC_ISSUER_REGEXP
    type: string
  - default: 'false'
    description: Skip Rekor transparency log checks during validation. Compatible with traditional signing secret signature checks only. If any of the CERTIFICATE_* keyless verification params are present, this value is disregarded and Rekor transparency log checks are included.
    name: IGNORE_REKOR
    type: string
  - default: ''
    description: TUF mirror URL. Provide a value when NOT using public sigstore deployment.
    name: TUF_MIRROR
    type: string
  - default: ''
    description: 'Path to a directory containing SSL certs to be used when communicating

      with external services. This is useful when using the integrated registry

      and a local instance of Rekor on a development cluster which may use

      certificates issued by a not-commonly trusted root CA. In such cases,

      `/var/run/secrets/kubernetes.io/serviceaccount` is a good value. Multiple

      paths can be provided by using the `:` separator.

      '
    name: SSL_CERT_DIR
    type: string
  - default: trusted-ca
    description: The name of the ConfigMap to read CA bundle data from.
    name: CA_TRUST_CONFIGMAP_NAME
    type: string
  - default: ca-bundle.crt
    description: The name of the key in the ConfigMap that contains the CA bundle data.
    name: CA_TRUST_CONFIG_MAP_KEY
    type: string
  - default: 'true'
    description: Include rule titles and descriptions in the output. Set to `"false"` to disable it.
    name: INFO
    type: string
  - default: 'true'
    description: Fail the task if policy fails. Set to `"false"` to disable it.
    name: STRICT
    type: string
  - default: /tekton/home
    description: Value for the HOME environment variable.
    name: HOMEDIR
    type: string
  - default: now
    description: Run policy checks with the provided time.
    name: EFFECTIVE_TIME
    type: string
  - default: 'false'
    description: Allow setting EFFECTIVE_TIME to a date in the past.
    name: ALLOW_PAST_EFFECTIVE_TIME
    type: string
  - default: ''
    description: Merge additional Rego variables into the policy data. Use syntax "key=value,key2=value2..."
    name: EXTRA_RULE_DATA
    type: string
  - default: sha256:ee5c3a020c9545eca738ed87198af0b235463069b2d72c5dba609364a83321d2
    description: Optional OCI digest to pin the release policy bundle. When provided, the policy configuration is resolved and the reference oci::quay.io/conforma/release-policy:konflux is replaced with oci::quay.io/conforma/release-policy@<digest>. Accepts a full digest (sha256:abc123...) or just the hex hash (abc123...).
    name: POLICY_BUNDLE_DIGEST
    type: string
  - default: '1'
    description: Number of parallel workers to use for policy evaluation.
    name: WORKERS
    type: string
  - default: ''
    description: Use the OPA evaluator instead of the default conftest evaluator. Set to "1" to enable.
    name: EC_USE_OPA
    type: string
  - default: 'false'
    description: Reduce the Snapshot to only the component whose build caused the Snapshot to be created
    name: SINGLE_COMPONENT
    type: string
  - default: unknown
    description: 'Name, including kind, of the Kubernetes resource to query for labels when single component mode is enabled, e.g. pr/somepipeline.

      '
    name: SINGLE_COMPONENT_CUSTOM_RESOURCE
    type: string
  - default: ''
    description: 'Kubernetes namespace where the SINGLE_COMPONENT_NAME is found. Only used when single component mode is enabled.

      '
    name: SINGLE_COMPONENT_CUSTOM_RESOURCE_NS
    type: string
  - default: 1s
    description: Base duration for exponential backoff calculation (e.g., "1s", "500ms")
    name: RETRY_DURATION
    type: string
  - default: '2.0'
    description: Exponential backoff multiplier (e.g., "2.0", "1.5")
    name: RETRY_FACTOR
    type: string
  - default: '0.1'
    description: Randomness factor for backoff calculation (0.0-1.0, e.g., "0.1", "0.2")
    name: RETRY_JITTER
    type: string
  - default: '3'
    description: Maximum number of retry attempts
    name: RETRY_MAX_RETRY
    type: string
  - default: 3s
    description: Maximum wait time between retries (e.g., "3s", "10s")
    name: RETRY_MAX_WAIT
    type: string
  results:
  - description: Short summary of the policy evaluation for each image
    name: TEST_OUTPUT
  stepTemplate:
    env:
    - name: HOME
      value: $(params.HOMEDIR)
  steps:
  - args:
    - sigstore
    - initialize
    - --mirror
    - $(params.TUF_MIRROR)
    - --root
    - $(params.TUF_MIRROR)/root.json
    command:
    - ec
    computeResources:
      limits:
        memory: 256Mi
        cpu: 200m
      requests:
        cpu: 100m
        memory: 256Mi
    image: quay.io/conforma/cli@sha256:b87bab27cdbb6abdc9e41106629a5ae8c5d04c1e2d859d67bc4fc76c5f7f277a
    imagePullPolicy: IfNotPresent
    name: initialize-tuf
    when:
    - input: $(params.TUF_MIRROR)
      operator: notin
      values:
      - ''
  - command:
    - reduce-snapshot.sh
    computeResources:
      limits:
        memory: 256Mi
        cpu: 200m
      requests:
        cpu: 100m
        memory: 256Mi
    env:
    - name: SNAPSHOT
      value: $(params.IMAGES)
    - name: SINGLE_COMPONENT
      value: $(params.SINGLE_COMPONENT)
    - name: CUSTOM_RESOURCE
      value: $(params.SINGLE_COMPONENT_CUSTOM_RESOURCE)
    - name: CUSTOM_RESOURCE_NAMESPACE
      value: $(params.SINGLE_COMPONENT_CUSTOM_RESOURCE_NS)
    - name: SNAPSHOT_PATH
      value: $(params.HOMEDIR)/snapshot.json
    image: quay.io/conforma/cli@sha256:b87bab27cdbb6abdc9e41106629a5ae8c5d04c1e2d859d67bc4fc76c5f7f277a
    imagePullPolicy: IfNotPresent
    name: reduce
    onError: continue
  - command:
    - pin-konflux-policy-bundle.sh
    computeResources:
      limits:
        memory: 256Mi
        cpu: 200m
      requests:
        cpu: 100m
        memory: 256Mi
    env:
    - name: POLICY_CONFIGURATION
      value: $(params.POLICY_CONFIGURATION)
    - name: POLICY_BUNDLE_DIGEST
      value: $(params.POLICY_BUNDLE_DIGEST)
    image: quay.io/conforma/cli@sha256:b87bab27cdbb6abdc9e41106629a5ae8c5d04c1e2d859d67bc4fc76c5f7f277a
    imagePullPolicy: IfNotPresent
    name: pin-policy-bundle
    onError: continue
  - computeResources:
      requests:
        cpu: 300m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    env:
    - name: POLICY_CONFIGURATION
      value: $(params.POLICY_CONFIGURATION)
    - name: PUBLIC_KEY
      value: $(params.PUBLIC_KEY)
    - name: CERTIFICATE_IDENTITY
      value: $(params.CERTIFICATE_IDENTITY)
    - name: CERTIFICATE_OIDC_ISSUER
      value: $(params.CERTIFICATE_OIDC_ISSUER)
    - name: CERTIFICATE_IDENTITY_REGEXP
      value: $(params.CERTIFICATE_IDENTITY_REGEXP)
    - name: CERTIFICATE_OIDC_ISSUER_REGEXP
      value: $(params.CERTIFICATE_OIDC_ISSUER_REGEXP)
    - name: REKOR_HOST
      value: $(params.REKOR_HOST)
    - name: IGNORE_REKOR
      value: $(params.IGNORE_REKOR)
    - name: WORKERS
      value: $(params.WORKERS)
    - name: INFO
      value: $(params.INFO)
    - name: EFFECTIVE_TIME
      value: $(params.EFFECTIVE_TIME)
    - name: ALLOW_PAST_EFFECTIVE_TIME
      value: $(params.ALLOW_PAST_EFFECTIVE_TIME)
    - name: EXTRA_RULE_DATA
      value: $(params.EXTRA_RULE_DATA)
    - name: RETRY_MAX_WAIT
      value: $(params.RETRY_MAX_WAIT)
    - name: RETRY_MAX_RETRY
      value: $(params.RETRY_MAX_RETRY)
    - name: RETRY_DURATION
      value: $(params.RETRY_DURATION)
    - name: RETRY_FACTOR
      value: $(params.RETRY_FACTOR)
    - name: RETRY_JITTER
      value: $(params.RETRY_JITTER)
    - name: EC_USE_OPA
      value: $(params.EC_USE_OPA)
    - name: HOMEDIR
      value: $(params.HOMEDIR)
    - name: SSL_CERT_DIR
      value: /tekton-custom-certs:/etc/ssl/certs:/etc/pki/tls/certs:/system/etc/security/cacerts:$(params.SSL_CERT_DIR)
    image: quay.io/conforma/cli@sha256:b87bab27cdbb6abdc9e41106629a5ae8c5d04c1e2d859d67bc4fc76c5f7f277a
    imagePullPolicy: IfNotPresent
    name: validate
    onError: continue
    script: "#!/bin/bash\nset -euo pipefail\n\n# Use policy override file if pin-policy-bundle produced one\nif [[ -f \"${HOMEDIR}/policy-with-pinned-bundle.yaml\" ]]; then\n  POLICY_CONFIGURATION=\"${HOMEDIR}/policy-with-pinned-bundle.yaml\"\nfi\n\ncmd_args=(\n  validate\n  image\n  --images=\"${HOMEDIR}/snapshot.json\"\n  --policy=\"${POLICY_CONFIGURATION}\"\n)\n\n# To keep bash logic as thin as possible we deliberately don't sanitize\n# these params. If something is wrong or missing let Conforma handle it.\n\nif [ -n \"${CERTIFICATE_IDENTITY}\" ] || \\\n   [ -n \"${CERTIFICATE_OIDC_ISSUER}\" ] || \\\n   [ -n \"${CERTIFICATE_IDENTITY_REGEXP}\" ] || \\\n   [ -n \"${CERTIFICATE_OIDC_ISSUER_REGEXP}\" ]; then\n  # If *any* of the above are non-empty assume the intention is to\n  # try keyless verification\n\n  if [ -n \"${CERTIFICATE_IDENTITY}\" ]; then\n    cmd_args+=(\n      --certificate-identity=\"${CERTIFICATE_IDENTITY}\"\n    )\n  elif [ -n \"${CERTIFICATE_IDENTITY_REGEXP}\" ]; then\n\
      \    cmd_args+=(\n      --certificate-identity-regexp=\"${CERTIFICATE_IDENTITY_REGEXP}\"\n    )\n  fi\n\n  if [ -n \"${CERTIFICATE_OIDC_ISSUER}\" ]; then\n    cmd_args+=(\n      --certificate-oidc-issuer=\"${CERTIFICATE_OIDC_ISSUER}\"\n    )\n  elif [ -n \"${CERTIFICATE_OIDC_ISSUER_REGEXP}\" ]; then\n    cmd_args+=(\n      --certificate-oidc-issuer-regexp=\"${CERTIFICATE_OIDC_ISSUER_REGEXP}\"\n    )\n  fi\n\n  # Force --ignore-rekor to false since we need rekor\n  cmd_args+=(\n    --ignore-rekor=false\n  )\nelse\n  # Assume traditional signing secret verification\n  cmd_args+=(\n    --public-key=\"${PUBLIC_KEY}\"\n    --ignore-rekor=\"${IGNORE_REKOR}\"\n  )\nfi\n\ncmd_args+=(\n  --rekor-url=\"${REKOR_HOST}\"\n  --workers=\"${WORKERS}\"\n  --info=\"${INFO}\"\n  --timeout=0\n  --strict=false\n  --show-successes=true\n  --show-policy-docs-link=true\n  --effective-time=\"${EFFECTIVE_TIME}\"\n  --allow-past-effective-time=\"${ALLOW_PAST_EFFECTIVE_TIME}\"\n  --extra-rule-data=\"${EXTRA_RULE_DATA}\"\
      \n  --retry-max-wait=\"${RETRY_MAX_WAIT}\"\n  --retry-max-retry=\"${RETRY_MAX_RETRY}\"\n  --retry-duration=\"${RETRY_DURATION}\"\n  --retry-factor=\"${RETRY_FACTOR}\"\n  --retry-jitter=\"${RETRY_JITTER}\"\n  --output=\"text=${HOMEDIR}/text-report.txt?show-successes=false\"\n  --output=\"json=${HOMEDIR}/report-json.json\"\n  --output=\"appstudio=$(results.TEST_OUTPUT.path)\"\n)\n\n\n# Execute Conforma with constructed arguments\nexec ec \"${cmd_args[@]}\"\n"
    volumeMounts:
    - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
      name: trusted-ca
      readOnly: true
      subPath: ca-bundle.crt
  - args:
    - jq . $(params.HOMEDIR)/report-json.json | awk '{gsub(/^ +/, ""); acc += length; if (acc >= 8000) { printf "\n"; acc=length } printf $0 }'
    command:
    - sh
    - -c
    computeResources:
      limits:
        memory: 256Mi
        cpu: 200m
      requests:
        cpu: 100m
        memory: 256Mi
    image: quay.io/conforma/cli@sha256:b87bab27cdbb6abdc9e41106629a5ae8c5d04c1e2d859d67bc4fc76c5f7f277a
    imagePullPolicy: IfNotPresent
    name: report-json
    onError: continue
  - args:
    - .
    - $(results.TEST_OUTPUT.path)
    command:
    - jq
    computeResources:
      limits:
        memory: 256Mi
        cpu: 200m
      requests:
        cpu: 100m
        memory: 256Mi
    image: quay.io/conforma/cli@sha256:b87bab27cdbb6abdc9e41106629a5ae8c5d04c1e2d859d67bc4fc76c5f7f277a
    imagePullPolicy: IfNotPresent
    name: summary
    onError: continue
  - args:
    - version
    command:
    - ec
    computeResources:
      limits:
        memory: 256Mi
        cpu: 200m
      requests:
        cpu: 100m
        memory: 256Mi
    image: quay.io/conforma/cli@sha256:b87bab27cdbb6abdc9e41106629a5ae8c5d04c1e2d859d67bc4fc76c5f7f277a
    imagePullPolicy: IfNotPresent
    name: version
  - args:
    - '{policy: .policy, key: .key, "effective-time": .["effective-time"]}'
    - $(params.HOMEDIR)/report-json.json
    command:
    - jq
    computeResources:
      limits:
        memory: 256Mi
        cpu: 200m
      requests:
        cpu: 100m
        memory: 256Mi
    image: quay.io/conforma/cli@sha256:b87bab27cdbb6abdc9e41106629a5ae8c5d04c1e2d859d67bc4fc76c5f7f277a
    imagePullPolicy: IfNotPresent
    name: show-config
  - args:
    - $(params.HOMEDIR)/text-report.txt
    command:
    - cat
    image: quay.io/conforma/cli@sha256:b87bab27cdbb6abdc9e41106629a5ae8c5d04c1e2d859d67bc4fc76c5f7f277a
    imagePullPolicy: IfNotPresent
    name: detailed-report
    onError: continue
    computeResources:
      limits:
        cpu: 200m
      requests:
        cpu: 100m
  - args:
    - --argjson
    - strict
    - $(params.STRICT)
    - -e
    - '.result == "SUCCESS" or .result == "WARNING" or ($strict | not)

      '
    - $(results.TEST_OUTPUT.path)
    command:
    - jq
    computeResources:
      limits:
        memory: 256Mi
        cpu: 200m
      requests:
        cpu: 100m
        memory: 256Mi
    image: quay.io/conforma/cli@sha256:b87bab27cdbb6abdc9e41106629a5ae8c5d04c1e2d859d67bc4fc76c5f7f277a
    imagePullPolicy: IfNotPresent
    name: assert
  volumes:
  - configMap:
      items:
      - key: $(params.CA_TRUST_CONFIG_MAP_KEY)
        path: ca-bundle.crt
      name: $(params.CA_TRUST_CONFIGMAP_NAME)
      optional: true
    name: trusted-ca
  workspaces:
  - description: The workspace where the snapshot spec json file resides
    name: data
    optional: true
