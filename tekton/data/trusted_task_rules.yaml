# Lab custom trusted task rules
# Enable the new trusted task rules system
---
rule_data:
  # CRITICAL: This flag enables custom trusted task rules
  trusted_task_rules_enabled: true

  # Allowed registry prefixes for base images
  allowed_registry_prefixes:
  - registry.access.redhat.com/
  - registry.redhat.io/
  - quay.io/
  - docker.io/
  - quay-t7cws-1.apps.cluster-t7cws.dyn.redhatworkshops.io/

  # Allowed step image registry prefixes
  allowed_step_image_registry_prefixes:
  - quay.io/
  - registry.access.redhat.com/
  - registry.redhat.io/
  - quay-t7cws-1.apps.cluster-t7cws.dyn.redhatworkshops.io/

  # Trusted task rules
  trusted_task_rules:
    allow:
      lab-custom-bundle:
        # Trust all tasks from our custom bundle (any digest)
        - pattern: oci://quay.io/rhpds/pipeline-docker-build-lab@sha256:.*
