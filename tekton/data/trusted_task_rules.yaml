# Custom trusted task rules for lab pipeline bundle
# Must match rhtap-ec-policy structure for proper merging
# Both files must have the same YAML hierarchy for merging to work
---
rule_data:
  trusted_task_rules:
    allow:
      lab-custom-bundle:
        # Allow all tasks from our custom lab bundle
        - pattern: oci://quay.io/rhpds/pipeline-docker-build-lab/*
