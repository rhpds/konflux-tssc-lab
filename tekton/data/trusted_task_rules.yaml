# Lab custom trusted task rules
# Enable the new trusted task rules system
---
rule_data:
  # CRITICAL: This flag enables custom trusted task rules
  trusted_task_rules_enabled: true

  # Allowed registry prefixes for base images
  # Include wildcard for cluster-local Quay (hostname is dynamic per cluster)
  allowed_registry_prefixes:
  - registry.access.redhat.com/
  - registry.redhat.io/
  - quay.io/
  - docker.io/
  - quay.*

  # Allowed step image registry prefixes
  allowed_step_image_registry_prefixes:
  - quay.io/
  - registry.access.redhat.com/
  - registry.redhat.io/
  - quay.*

  # Trusted task rules
  trusted_task_rules:
    allow:
      lab-custom-bundle:
        # Trust all tasks from our custom bundle repository
        - pattern: quay.io/rhpds/pipeline-docker-build-lab*
      konflux-ci-build-tools:
        # Trust Konflux CI build tooling images (used in materials)
        - pattern: oci://quay.io/konflux-ci/build-trusted-artifacts*
        - pattern: quay.io/konflux-ci/*
